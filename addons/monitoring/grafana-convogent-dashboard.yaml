apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-convogent-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Convogent"
data:
  convogent-app-dashboard.json: |
    {
      "uid": "convogent-app",
      "title": "Convogent - Stage",
      "description": "CPU, memory, network, and disk I/O for Convogent microservices in namespace stage",
      "tags": ["convogent", "stage"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        { "id": 100, "type": "row", "title": "Stage namespace", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "collapsed": false },
        {
          "id": 101, "type": "stat", "title": "Deployments",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "count(kube_deployment_spec_replicas{namespace=\"stage\"})" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 102, "type": "stat", "title": "StatefulSets",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "count(kube_statefulset_replicas{namespace=\"stage\"})" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 103, "type": "stat", "title": "Services",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "count(kube_service_info{namespace=\"stage\"})" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 104, "type": "stat", "title": "Ingresses",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "count(kube_ingress_info{namespace=\"stage\"})" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 105, "type": "stat", "title": "Running pods",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"stage\", phase=\"Running\"} == 1)" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        { "id": 4, "type": "row", "title": "Backend", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }, "collapsed": false },
        {
          "id": 5, "type": "timeseries", "title": "CPU - Backend",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 } } },
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"stage\", pod=~\"convogentv2-backend.*\", container!=\"\", container!=\"POD\"}[5m])) by (pod)", "legendFormat": "{{pod}}" }]
        },
        {
          "id": 6, "type": "timeseries", "title": "Memory - Backend",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2 } } },
          "targets": [{ "expr": "sum(container_memory_working_set_bytes{namespace=\"stage\", pod=~\"convogentv2-backend.*\", container!=\"\", container!=\"POD\"}) by (pod)", "legendFormat": "{{pod}}" }]
        },
        {
          "id": 30, "type": "timeseries", "title": "Network IO - Backend",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "lineWidth": 2 } } },
          "targets": [
            { "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"stage\", pod=~\"convogentv2-backend.*\"}[5m])) by (pod)", "legendFormat": "rx/{{pod}}" },
            { "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"stage\", pod=~\"convogentv2-backend.*\"}[5m])) by (pod)", "legendFormat": "tx/{{pod}}" }
          ]
        },
        {
          "id": 31, "type": "timeseries", "title": "Disk IO - Backend",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps", "noValue": "0", "custom": { "lineWidth": 2, "spanNulls": true } } },
          "targets": [
            { "expr": "sum by (pod) (rate(container_fs_reads_bytes_total{namespace=\"stage\", pod=~\"convogentv2-backend.*\", container=\"backend\"}[5m]) or rate(container_fs_reads_total{namespace=\"stage\", pod=~\"convogentv2-backend.*\", container=\"backend\"}[5m]) * 512) or on(pod) (0 * group by (pod) (kube_pod_info{namespace=\"stage\", pod=~\"convogentv2-backend.*\"}))", "legendFormat": "read/{{pod}}" },
            { "expr": "sum by (pod) (rate(container_fs_writes_bytes_total{namespace=\"stage\", pod=~\"convogentv2-backend.*\", container=\"backend\"}[5m]) or rate(container_fs_writes_total{namespace=\"stage\", pod=~\"convogentv2-backend.*\", container=\"backend\"}[5m]) * 512) or on(pod) (0 * group by (pod) (kube_pod_info{namespace=\"stage\", pod=~\"convogentv2-backend.*\"}))", "legendFormat": "write/{{pod}}" }
          ]
        },
        { "id": 7, "type": "row", "title": "Frontend", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 }, "collapsed": false },
        {
          "id": 8, "type": "timeseries", "title": "CPU - Frontend",
