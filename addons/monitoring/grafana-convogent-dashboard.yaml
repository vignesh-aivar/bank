            { "expr": "sum by (pod) (rate(container_fs_writes_bytes_total{namespace=\"stage\", pod=~\"convogentv2-frontend.*\", container=\"frontend\"}[5m]) or rate(container_fs_writes_total{namespace=\"stage\", pod=~\"convogentv2-frontend.*\", container=\"frontend\"}[5m]) * 512) or on(pod) (0 * group by (pod) (kube_pod_info{namespace=\"stage\", pod=~\"convogentv2-frontend.*\"}))", "legendFormat": "write/{{pod}}" }
          ]
