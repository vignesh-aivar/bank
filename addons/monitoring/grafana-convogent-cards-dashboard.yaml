apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-convogent-cards-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Convogent"
data:
  convogent-cards-dashboard.json: |
    {
      "uid": "convogent-current",
      "title": "Convogent - Current Metrics (Cards)",
      "description": "Current (latest) CPU cores, Memory, Network RX/TX per Convogent service in the stage namespace. Each card shows one value.",
      "tags": [
        "convogent",
        "cards",
        "current",
        "cpu",
        "memory",
        "network"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-5m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "custom",
            "label": "Namespace",
            "query": "stage : stage",
            "current": {
              "value": "stage",
              "text": "stage",
              "selected": true
            },
            "options": [
              {
                "value": "stage",
                "text": "stage",
                "selected": true
              }
            ],
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Voice Service",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CPU cores - Voice Service",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 3,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No data"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "auto"
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"convogentv2-voice.*\"}[5m])) by (namespace)",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Memory - Voice Service",
