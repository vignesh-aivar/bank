# Prometheus Adapter — Bank EKS (air-gapped)
# Exposes livekit_egress_requests for custom HPA scaling

replicas: 1

image:
  repository: public.ecr.aws/u7h9i3k7/monitoring/prometheus-adapter

nodeSelector:
  NodeGroupType: monitoring

tolerations:
  - key: workload
    operator: Equal
    value: monitoring
    effect: NoSchedule

rules:
  default: false
  custom:
    - seriesQuery: 'livekit_egress_requests{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: livekit_egress_requests
      metricsQuery: 'sum(livekit_egress_requests{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

prometheus:
  url: http://prometheus-prometheus.monitoring.svc.cluster.local
  port: 9090

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 200m
    memory: 512Mi
