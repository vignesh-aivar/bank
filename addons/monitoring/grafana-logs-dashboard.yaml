apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-logs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Convogent"
data:
  convogent-logs-dashboard.json: |
    {
      "uid": "convogent-logs",
      "title": "Convogent - Logs",
      "description": "Centralized logs for all Convogent and LiveKit services",
      "tags": ["convogent", "logs", "loki"],
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
            "query": "label_values(k8s_namespace_name)",
            "current": { "text": "convogent", "value": "convogent" },
            "includeAll": true,
            "multi": true,
            "refresh": 2
          },
          {
            "name": "service",
            "type": "query",
            "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
            "query": "label_values({k8s_namespace_name=~\"$namespace\"}, service_name)",
            "current": { "text": "All", "value": "$__all" },
            "includeAll": true,
            "multi": true,
            "refresh": 2
          },
          {
            "name": "search",
            "type": "textbox",
            "current": { "text": "", "value": "" },
            "label": "Search"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "All Logs",
          "gridPos": { "h": 20, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "{k8s_namespace_name=~\"$namespace\", service_name=~\"$service\"} |= \"$search\"",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Log Volume by Service",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "sum(count_over_time({k8s_namespace_name=~\"$namespace\", service_name=~\"$service\"} |= \"$search\" [1m])) by (service_name)",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "lineWidth": 2, "fillOpacity": 20, "stacking": { "mode": "normal" } }
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error Rate by Service",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "sum(count_over_time({k8s_namespace_name=~\"$namespace\", service_name=~\"$service\"} |~ \"(?i)error\" [1m])) by (service_name)",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Total Log Lines (last 5m)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 36 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "sum(count_over_time({k8s_namespace_name=~\"$namespace\"} [5m]))",
              "refId": "A"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Error Lines (last 5m)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 36 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "sum(count_over_time({k8s_namespace_name=~\"$namespace\"} |~ \"(?i)error\" [5m]))",
              "refId": "A"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 10, "color": "yellow" }, { "value": 50, "color": "red" }] } } }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Warning Lines (last 5m)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 36 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "sum(count_over_time({k8s_namespace_name=~\"$namespace\"} |~ \"(?i)warn\" [5m]))",
              "refId": "A"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 20, "color": "yellow" }, { "value": 100, "color": "orange" }] } } }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Active Services",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 36 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "count(count by (service_name) (count_over_time({k8s_namespace_name=~\"$namespace\"} [5m])))",
              "refId": "A"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" }
        }
      ],
      "schemaVersion": 38
    }
