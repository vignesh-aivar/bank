apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: livekit-public
spec:
  amiSelectorTerms:
    - alias: al2023@latest

  role: convogent-bank-karpenter-node

  # Public subnets — SIP pods need a public IP for direct RTP media to PSTN peers.
  # Discovered via the dedicated karpenter.sh/discovery/sip tag set on all 3
  # public subnets in the convogent-v2 VPC (vpc-0f780c7c9f67a8fa3):
  #   ap-south-1a: subnet-0bda2896d1ee6be56
  #   ap-south-1b: subnet-01dc14f1aeaecf74f
  #   ap-south-1c: subnet-0fde7ae6201042e3f
  associatePublicIPAddress: true
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery/sip: convogent-v2-loadtest

  # Cluster SG + dedicated livekit media ports SG
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: convogent-v2-loadtest
    - tags:
        livekit/node-sg: "true"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 80Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1

  tags:
    Project: convogent-v2
    Environment: production
    ManagedBy: karpenter
    karpenter.sh/discovery: convogent-v2-loadtest
    Component: livekit-sip
