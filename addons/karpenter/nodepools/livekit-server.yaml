# LiveKit SFU server — on-demand only; SFU state is not recoverable on spot interruption.
# Pinned to ap-south-1a so server↔egress and server↔SIP traffic stays intra-AZ.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: livekit-server
spec:
  template:
    metadata:
      labels:
        workload: livekit-server
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: livekit-private
      taints:
        - key: workload
          value: livekit-server
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["c7g.2xlarge", "c7g.xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-south-1a"]

  limits:
    cpu: "100"
    memory: 200Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 15m
