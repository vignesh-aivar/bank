# LiveKit egress — recording/streaming pipeline. On-demand only because recording
# jobs are lost on spot interruption and cannot be resumed. Pinned to ap-south-1a
# for intra-AZ media with SFU. WhenEmpty consolidation policy ensures nodes are
# never consolidated while recordings are in flight (only removed when fully drained).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: livekit-egress
spec:
  template:
    metadata:
      labels:
        workload: livekit-egress
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: livekit-egress
      taints:
        - key: workload
          value: livekit-egress
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["c7g.2xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-south-1a"]

  limits:
    cpu: "100"
    memory: 200Gi

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
