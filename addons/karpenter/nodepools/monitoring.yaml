# Dev-stage observability — single AZ so all gp3 PVCs share one zone (cost + scheduling).
# Metrics (Prometheus), logs (Loki), traces (Tempo) pin here via nodeSelector + tolerations.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: monitoring
spec:
  template:
    metadata:
      labels:
        NodeGroupType: monitoring
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: workload
          value: monitoring
          effect: NoSchedule
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t4g", "m7g"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-south-1b"]
      expireAfter: 720h

  limits:
    cpu: 8
    memory: 16Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m

  weight: 10
