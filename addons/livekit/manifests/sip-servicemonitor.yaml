apiVersion: v1
kind: Service
metadata:
  name: livekit-sip-metrics
  namespace: livekit
  labels:
    app: livekit-sip
    component: metrics
spec:
  selector:
    app: livekit-sip
  ports:
    - name: metrics
      port: 7880
      targetPort: 7880
  clusterIP: None
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: livekit-sip
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - livekit
  selector:
    matchLabels:
      app: livekit-sip
      component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
