# TURN NLB — static EIP in us-east-1a (must match livekit-server affinity zone).
# Ports: 5349 TURN TLS (ACM cert), 3478 TURN UDP, 7881 WebRTC TCP, 7882 WebRTC UDP mux.
# Single-AZ intentional: EIP is zone-pinned; cross-zone routing adds latency for real-time media.
apiVersion: v1
kind: Service
metadata:
  name: livekit-turn
  namespace: livekit
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0bda2896d1ee6be56"
    service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "eipalloc-04aeedffebc08caa0"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:ap-south-1:646731024209:certificate/8dcbd76d-7188-4e30-9dfd-9fba09790e8c"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "5349"
    service.beta.kubernetes.io/aws-load-balancer-enable-tcp-udp-listener: "true"
    external-dns.alpha.kubernetes.io/hostname: turn.livekit.loadtest.convogent.ai
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: livekit-server
  ports:
    - name: turn-tls
      protocol: TCP
      port: 5349
      targetPort: 5349
    - name: turn-udp
      protocol: UDP
      port: 3478
      targetPort: 3478
    - name: lk-rtc-tcp
      protocol: TCP
      port: 7881
      targetPort: 7881
    - name: lk-rtc-udp
      protocol: UDP
      port: 7882
      targetPort: 7882
