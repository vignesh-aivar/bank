# livekit-egress Helm values — Bank EKS (air-gapped)
replicaCount: 1


terminationGracePeriodSeconds: 3600


image:
  repository: public.ecr.aws/u7h9i3k7/livekit/livekit-egress
  tag: latest
  pullPolicy: IfNotPresent


egress:

  api_key: "<LIVEKIT_API_KEY>"
  api_secret: "<LIVEKIT_API_SECRET>"
  ws_url: "ws://livekit-server.livekit.svc.cluster.local:80"
  log_level: info


  redis:
    address: "<REDIS_ENDPOINT>:6379"


  s3:
    region: "ap-south-1"
    bucket: "<S3_EGRESS_BUCKET>"


  prometheus_port: 6789


  cpu_cost:
    room_composite_cpu_cost: 0.5


podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "6789"


autoscaling:
  enabled: false


serviceAccount:
  create: true
  name: livekit-egress


nodeSelector:
  workload: livekit-egress


tolerations:
  - key: "workload"
    operator: "Equal"
    value: "livekit-egress"
    effect: "NoSchedule"


resources:
  requests:
    cpu: "3500m"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "4Gi"