# SIP NLB — internet-facing, multi-AZ, no EIP (dynamic DNS).
# TCP_UDP listener handles both protocols on port 5060.
# Health check on 5060 TCP (not 6789 metrics — metrics port not in node SG).
apiVersion: v1
kind: Service
metadata:
  name: livekit-sip-nlb
  namespace: livekit
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0bda2896d1ee6be56,subnet-01dc14f1aeaecf74f,subnet-0fde7ae6201042e3f"
    service.beta.kubernetes.io/aws-load-balancer-enable-tcp-udp-listener: "true"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "5060"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "TCP"
    external-dns.alpha.kubernetes.io/hostname: sip.livekit.loadtest.convogent.ai
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: livekit-sip
  ports:
    - name: sip-tcp
      protocol: TCP
      port: 5060
      targetPort: 5060
    - name: sip-udp
      protocol: UDP
      port: 5060
      targetPort: 5060
