{{- if and .Values.backend.enabled ((.Values.backend.externalSecret).enabled) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.backend.externalSecret.name }}
  namespace: {{ include "convogent-backend.namespace" . }}
  labels:
    {{- include "convogent-backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.backend.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.backend.externalSecret.secretStoreRef | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.backend.externalSecret.name }}
    creationPolicy: Owner
  dataFrom:
    {{- range .Values.backend.externalSecret.dataFrom }}
    - extract:
        key: {{ .key }}
    {{- end }}
{{- end }}
