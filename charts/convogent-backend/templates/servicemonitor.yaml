{{- if and .Values.backend.enabled ((.Values.backend.serviceMonitor).enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "convogent-backend.name" . }}
  namespace: {{ include "convogent-backend.namespace" . }}
  labels:
    {{- include "convogent-backend.labels" . | nindent 4 }}
    {{- with .Values.backend.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "convogent-backend.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.backend.serviceMonitor.path | default "/metrics" }}
      interval: {{ .Values.backend.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.backend.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
