{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "convogent-backend.name" . }}
  namespace: {{ include "convogent-backend.namespace" . }}
  labels:
    {{- include "convogent-backend.labels" . | nindent 4 }}
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  {{- with .Values.backend.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "convogent-backend.selectorLabels" . | nindent 4 }}
{{- end }}
