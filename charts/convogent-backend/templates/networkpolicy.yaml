{{- if and .Values.backend.enabled ((.Values.backend.networkPolicy).enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "convogent-backend.name" . }}
  namespace: {{ include "convogent-backend.namespace" . }}
  labels:
    {{- include "convogent-backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "convogent-backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ALB (any pod matching the ingress path)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    {{- with .Values.backend.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow all egress (can be restricted later)
    - {}
{{- end }}
