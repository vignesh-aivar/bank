{{- if and .Values.backend.enabled .Values.backend.createSecret }}
# Legacy: creates a plain Kubernetes Secret from values.
# Prefer using externalSecret.enabled instead (pulls from AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.secretName }}
  namespace: {{ include "convogent-backend.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "convogent-backend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.backend.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
