voiceService:
  enabled: true
  name: convogent-voice
  serviceAccountName: convogent-voice-sa
  serviceAccount:
    create: true
    annotations: {}
  replicaCount: 1
  image:
    repository: convogent-voice
    tag: "latest"
    pullPolicy: Always
  service:
    port: 9000
    type: ClusterIP
  resources:
    requests:
      memory: "2.5Gi"
      cpu: "2000m"
    limits:
      memory: "4Gi"
      cpu: "4"
  livenessProbe:
    path: /voice_service/health
    port: 9000
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    path: /voice_service/health
    port: 9000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  envFromSecret: "convogent-voice-secrets"
  externalSecret:
    enabled: false
  preStopSleepSeconds: 30
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 20
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 70
    scaleDownStabilizationWindowSeconds: 3600
    scaleDownPods: 1
    scaleDownPeriodSeconds: 120
    scaleDownSelectPolicy: Min
  podMonitor:
    enabled: false
  nodeSelector:
    NodeGroupType: agent-voice
  tolerations:
    - key: workload
      operator: Equal
      value: agent-voice
      effect: NoSchedule
