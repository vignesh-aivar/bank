# Client EKS environment — HDFC client cluster (ap-south-1)
# ECR registry: 273354645607.dkr.ecr.ap-south-1.amazonaws.com
# Update tags from "latest" to specific commit SHAs for production deployments.

global:
  namespace: convogent
  environment: production
  serviceAccountName: convogent-app-sa  # fallback
  serviceAccount:
    create: false
    annotations: {}
  imageRegistry: 273354645607.dkr.ecr.ap-south-1.amazonaws.com
  host: ""          # TODO: Set your domain
  agentHost: ""     # TODO: Set your agent domain

frontend:
  enabled: true
  name: convogent-frontend
  serviceAccountName: ""
  serviceAccount:
    create: false
    annotations: {}
  replicaCount: 1
  image:
    repository: convogent-frontend
    tag: "latest"
    pullPolicy: Always
  service:
    port: 8080
    type: ClusterIP
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  livenessProbe:
    path: /
    port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    path: /
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector:
    NodeGroupType: app
  tolerations:
    - key: workload
      operator: Equal
      value: app
      effect: NoSchedule

backend:
  enabled: true
  name: convogent-backend
  serviceAccountName: convogent-backend-sa
  serviceAccount:
    create: true
    annotations: {}
  replicaCount: 1
  image:
    repository: convogent-backend
    tag: "latest"
    pullPolicy: Always
  service:
    port: 8000
    type: ClusterIP
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /health
      alb.ingress.kubernetes.io/healthcheck-port: traffic-port
      alb.ingress.kubernetes.io/success-codes: "200"
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  startupProbe:
    path: /health
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 24
  livenessProbe:
    path: /health
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    path: /health
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  envFromSecret: "convogent-backend-secrets"
  createSecret: false
  secretName: "convogent-backend-secrets"
  externalSecret:
    enabled: false
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  nodeSelector:
    NodeGroupType: app
  tolerations:
    - key: workload
      operator: Equal
      value: app
      effect: NoSchedule

chatService:
  enabled: true
  name: convogent-chat
  serviceAccountName: convogent-chat-sa
  serviceAccount:
    create: true
    annotations: {}
  replicaCount: 1
  image:
    repository: convogent-chat
    tag: "latest"
    pullPolicy: Always
  service:
    port: 9001
    type: ClusterIP
  resources:
    requests:
      memory: "384Mi"
      cpu: "200m"
    limits:
      memory: "768Mi"
      cpu: "500m"
  livenessProbe:
    path: /chat_service/health
    port: 9001
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    path: /chat_service/health
    port: 9001
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5
  envFromSecret: "convogent-chat-secrets"
  externalSecret:
    enabled: false
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
    scaleDownStabilizationWindowSeconds: 1800
  nodeSelector:
    NodeGroupType: app
  tolerations:
    - key: workload
      operator: Equal
      value: app
      effect: NoSchedule

evalService:
  enabled: true
  name: convogent-eval
  serviceAccountName: convogent-eval-sa
  serviceAccount:
    create: true
    annotations: {}
  replicaCount: 1
  image:
    repository: convogent-eval
    tag: "latest"
    pullPolicy: Always
  service:
    port: 9002
    type: ClusterIP
  resources:
    requests:
      memory: "192Mi"
      cpu: "150m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  livenessProbe:
    path: /eval_service/health
    port: 9002
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    path: /eval_service/health
    port: 9002
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5
  envFromSecret: "convogent-eval-secrets"
  externalSecret:
    enabled: false
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  nodeSelector:
    NodeGroupType: app
  tolerations:
    - key: workload
      operator: Equal
      value: app
      effect: NoSchedule

pcaService:
  enabled: true
  name: convogent-pca
  serviceAccountName: convogent-pca-sa
  serviceAccount:
    create: true
    annotations: {}
  replicaCount: 1
  image:
    repository: convogent-pca
    tag: "latest"
    pullPolicy: Always
  service:
    port: 9003
    type: ClusterIP
  resources:
    requests:
      memory: "192Mi"
      cpu: "150m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  livenessProbe:
    path: /pca_service/health
    port: 9003
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    path: /pca_service/health
    port: 9003
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5
  envFromSecret: "convogent-pca-secrets"
  externalSecret:
    enabled: false
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  nodeSelector:
    NodeGroupType: app
  tolerations:
    - key: workload
      operator: Equal
