# Chat Service (microservice 1)
chatService:
  enabled: true
  name: convogentv2-chat-stage
  replicaCount: 0
  image:
    repository: convogent-chat-service
    tag: "42d212a58539ef0b1ba03094efc8c80b3decf443"
    pullPolicy: Always
  service:
    port: 9001
    type: ClusterIP
  resources:
    requests:
      memory: "384Mi"
      cpu: "200m"
    limits:
      memory: "768Mi"
      cpu: "500m"
  livenessProbe:
    path: /chat_service/health
    port: 9001
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    path: /chat_service/health
    port: 9001
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5
  nodeSelector:
    NodeGroupType: app
  tolerations:
    - key: workload
      operator: Equal
      value: app
      effect: NoSchedule
  envFromSecret: "convogentv2-chat-secrets-stage"
  externalSecret:
    enabled: true
    refreshInterval: "1m"
    name: convogentv2-chat-secrets-stage
    dataFrom:
      - key: convogent-v2/stage/chat
  env:
    # AWS_REGION: "us-east-1"
    # S3_BUCKET: "convogent-v2-conversation"
    # WEBSOCKET_URL: "wss://chat.hdfcstage.convogent.ai"
    # FLOW_SERVICE_URL: "http://convogentv2-backend-stage.stage.svc.cluster.local:8000"
    # FLOW_AGENT_CONFIG_SOURCE: "draft"
    # FLOW_AGENT_CONFIG_VERSION_ID: ""
    # BACKEND_AUTH_TOKEN: "voice-agent-backend"
    # BEDROCK_MODEL: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    # LOG_LEVEL: "INFO"
    # MCP_ENABLED: "false"
    # MCP_BASE_URL: ""
  # KEDA event-driven autoscaling — CPU + memory. Conservative scale-down so
  # long-lived websocket sessions are drained slowly (see scaledobject.yaml).
  keda:
    enabled: false
    pollingInterval: 15
    cooldownPeriod: 600
    minReplicas: 1
    maxReplicas: 5
    scaleDownStabilization: 1800
    triggers:
      - type: cpu
        metricType: Utilization
        metadata:
          value: "65"
      - type: memory
        metricType: Utilization
        metadata:
          value: "75"
