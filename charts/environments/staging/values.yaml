# Voice Service (microservice 4)
voiceService:
  enabled: true
  name: convogentv2-voice-stage
  replicaCount: 0
  image:
    repository: convogent-voice-service
    tag: "42d212a58539ef0b1ba03094efc8c80b3decf443"
    pullPolicy: Always
  service:
    port: 9000
    type: ClusterIP
  resources:
    requests:
      memory: "2.5Gi"
      cpu: "2000m"
    limits:
      memory: "4Gi"
      cpu: "4"
  livenessProbe:
    path: /voice_service/health
    port: 9000
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    path: /voice_service/health
    port: 9000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector:
    NodeGroupType: agent-voice
  tolerations:
    - key: workload
      operator: Equal
      value: agent-voice
      effect: NoSchedule
  envFromSecret: "convogentv2-voice-secrets-stage"
  externalSecret:
    enabled: true
    refreshInterval: "1m"
    name: convogentv2-voice-secrets-stage
    dataFrom:
      - key: convogent-v2/stage/voice-service
  env:
    # S3_BUCKET: "convogent-v2-stage"
    # AWS_DEFAULT_REGION: "us-east-1"
    # AWS_REGION: "us-east-1"
    # HOST: "0.0.0.0"
    # LOG_LEVEL: "DEBUG"
    # RECORDINGS_DIR: "sip_call_recordings"
    # RECORDING_ENABLED: "True"
    # LOCAL_AUDIO_RECORDING_ENABLED: "True"
    # BEDROCK_GUARDRAIL_VERSION: "2"
    # BEDROCK_GUARDRAILS_ENABLED: "true"
    # RAG_EMBEDDING_MODEL: "amazon.titan-embed-text-v2:0"
    # RAG_EMBEDDING_DIMENSION: "512"
    # RAG_EMBEDDING_NORMALIZE: "true"
    # BACKGROUND_AUDIO_PATH: "data/output_16k_mono.wav"
    # FLOW_SERVICE_URL: "http://convogentv2-backend-stage.stage.svc.cluster.local:8000"
    # BACKEND_AUTH_TOKEN: "voice-agent-backend"
    # LIVEKIT_URL: "wss://livekit.hdfcstage.convogent.ai"
    # LIVEKIT_API_KEY: "apikey-f08c885db1aa9798"
    # LIVEKIT_API_SECRET: "ZCoo5vnP1ec1dFzAluM0SWneFH0zmokm7DjJmQecRk6zIFifHF9rzO73DlNcoJYQ"
    # REDIS_URL: "redis://convogent-v2-stage-livekit-redis.8cgsqi.ng.0001.use1.cache.amazonaws.com:6379"
    # WEBSOCKET_URL: "ws://localhost:9000"
    # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"
    # OTEL_SERVICE_NAME: "convogent-voice-stage"
    # KAFKA_ENABLED: "true"
    # KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
    # KAFKA_SASL_MECHANISM: "AWS_MSK_IAM"
    # KAFKA_CALL_REQUESTS_TOPIC: "call-requests"
    # KAFKA_CALL_COMPLETED_TOPIC: "call-completed"
    # KAFKA_CONSUMER_GROUP_ID: "voice-agent-consumer-group"
    # KAFKA_BOOTSTRAP_SERVERS: "b-1.convogentv2stagemsk.33kree.c12.kafka.us-east-1.amazonaws.com:9098,b-2.convogentv2stagemsk.33kree.c12.kafka.us-east-1.amazonaws.com:9098,b-3.convogentv2stagemsk.33kree.c12.kafka.us-east-1.amazonaws.com:9098"
    # MSK_ROLE_ARN: "arn:aws:iam::368886161280:role/MSKAppRole"
    # FLOW_AGENT_CONFIG_SOURCE: "draft"
    # FLOW_AGENT_CONFIG_VERSION_ID: ""
    # CHAT_SESSION_TTL: "3600"
    # CHAT_HISTORY_MAX_MESSAGES: "100"
    # EVAL_DEBUG: "false"
    # TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, X_API_KEY — add to convogent-v2/stage/voice-service JSON when needed
  preStopSleepSeconds: 30
  pdb:
    enabled: false
  # HPA disabled — KEDA manages the HorizontalPodAutoscaler for this service.
  # KEDA creates its own HPA and will conflict with this one if both are enabled.
  autoscaling:
    enabled: false
    minReplicas: 0
    maxReplicas: 20
    targetCPUUtilizationPercentage: 40
    targetMemoryUtilizationPercentage: ""
    scaleDownStabilizationWindowSeconds: 3600
    scaleDownPods: 1
    scaleDownPeriodSeconds: 120
    scaleDownSelectPolicy: Min
    scaleUpStabilizationWindowSeconds: 30
    scaleUpPeriodSeconds: 15
  # KEDA event-driven autoscaling — CPU primary (voice workload is CPU-bound)
  # with a fallback to 2 replicas if scaler fails. Longer cooldown because
  # voice calls are long-lived and we don't want to evict mid-call.
  keda:
    enabled: false
    pollingInterval: 15
    cooldownPeriod: 600
    minReplicas: 1
    maxReplicas: 20
    scaleDownStabilization: 3600
    fallback:
      failureThreshold: 3
      replicas: 1
    triggers:
      - type: cpu
        metricType: Utilization
        metadata:
          value: "70"
      - type: memory
        metricType: Utilization
        metadata:
          value: "70"