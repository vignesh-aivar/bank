    # S3_BUCKET_ARN: "arn:aws:s3:::convogent-v2-stage"
    # AGENT_BACKEND_URL: "http://convogentv2-voice-stage.stage.svc.cluster.local:9000/voice_service"
    # COGNITO_ENABLED: "true"
    # COGNITO_USER_POOL_ID: "us-east-1_mWnQrDwrV"
    # COGNITO_DOMAIN: "hdfc-convogent-stage.auth.us-east-1.amazoncognito.com"
    # COGNITO_REDIRECT_URI: "https://hdfcstage.convogent.ai/api/auth/cognito/token"
