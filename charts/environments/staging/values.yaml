    # COGNITO_CLIENT_ID: "1g33l9n56d4stutlq1rludq70l"
    # COGNITO_CLIENT_SECRET: "1m4coq920lkcoacllo47hrbb3vk4k99p6qt5a8j26iqeq3fuhh1f"
    # COOKIE_SIGNING_MASTER_KEY: "c96e863e293972a8426eb7bed57242898ffe2fa2f7621587fbd7a1eb2a9ca7e1"
