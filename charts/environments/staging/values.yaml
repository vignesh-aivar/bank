# Staging environment — convogent-v2-stage cluster
# Deployed via ArgoCD from charts/ with this values overlay
# NOTE: Secrets should be managed via ExternalSecrets, not committed here
#
# Stage replica counts — scaled to 0 (shutdown). Restore to 1 when bringing stage back up.

global:
  namespace: stage
  environment: stage
  serviceAccountName: convogentv2-stage-sa
  serviceAccount:
    create: true
    annotations: {}
  imageRegistry: public.ecr.aws/q7j2m2s0
  host: hdfcstage.convogent.ai
  agentHost: agent.hdfcstage.convogent.ai
  # Edge routing: argocd-apps/platform/addons/ingress/convogent-stage.yaml (ALB Ingress)
frontend:
  enabled: true
  name: convogentv2-frontend-stage
  replicaCount: 0
  image:
    repository: convogent-frontend
    tag: "9acd37f790955212f2301aeeb82a8a2416a4d252"
    pullPolicy: Always
  service:
    port: 8080
    type: ClusterIP
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  livenessProbe:
    path: /
    port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    path: /
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  nodeSelector:
    NodeGroupType: app
  tolerations:
    - key: workload
      operator: Equal
      value: app
      effect: NoSchedule
  # KEDA event-driven autoscaling — CPU + memory (stateless web tier)
  keda:
    enabled: false
    pollingInterval: 15
    cooldownPeriod: 300
    minReplicas: 1
    maxReplicas: 3
    scaleDownStabilization: 300
    triggers:
      - type: cpu
        metricType: Utilization
        metadata:
          value: "60"
      - type: memory
        metricType: Utilization
        metadata:
          value: "70"
backend:
  enabled: true
  name: convogentv2-backend-stage
  replicaCount: 0
  image:
    repository: convogent-backend
    tag: "3552582ba6933c9b1e933a394f232d7845decbb3"
    pullPolicy: Always
  service:
    port: 8000
    type: ClusterIP
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /health
      alb.ingress.kubernetes.io/healthcheck-port: traffic-port
      alb.ingress.kubernetes.io/success-codes: "200"
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  startupProbe:
    path: /health
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 24
  livenessProbe:
    path: /health
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    path: /health
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  nodeSelector:
    NodeGroupType: app
  tolerations:
    - key: workload
      operator: Equal
      value: app
      effect: NoSchedule
  envFromSecret: "convogentv2-backend-secrets-stage"
  createSecret: false
  secretName: "convogentv2-backend-secrets-stage"
  externalSecret:
    enabled: true
    refreshInterval: "1m"
    name: convogentv2-backend-secrets-stage
    dataFrom:
      - key: convogent-v2/stage/backend
  serviceMonitor:
    enabled: true
    labels:
