{{- if .Values.pcaService.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "convogent-pca.name" . }}-config
  namespace: {{ include "convogent-pca.namespace" . }}
  labels:
    {{- include "convogent-pca.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.pcaService.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
