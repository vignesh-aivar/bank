{{- if .Values.chatService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "convogent-chat.name" . }}
  namespace: {{ include "convogent-chat.namespace" . }}
  labels:
    {{- include "convogent-chat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.chatService.replicaCount }}
  revisionHistoryLimit: {{ .Values.chatService.revisionHistoryLimit | default 5 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ ((.Values.chatService.strategy).maxSurge) | default "25%" }}
      maxUnavailable: {{ ((.Values.chatService.strategy).maxUnavailable) | default 0 }}
  selector:
    matchLabels:
      {{- include "convogent-chat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "convogent-chat.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.chatService.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.chatService.serviceAccountName | default .Values.global.serviceAccountName }}
      terminationGracePeriodSeconds: {{ .Values.chatService.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        {{- include "convogent-chat.podSecurityContext" . | nindent 8 }}
      {{- with .Values.chatService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.chatService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.chatService.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.chatService.topologySpreadConstraints }}
        - {{ toYaml . | nindent 10 | trim }}
          labelSelector:
            matchLabels:
              {{- include "convogent-chat.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      containers:
        - name: chat
          image: {{ include "convogent-chat.image" . }}
          imagePullPolicy: {{ .Values.chatService.image.pullPolicy }}
          securityContext:
            {{- include "convogent-chat.containerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.chatService.service.port }}
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "convogent-chat.name" . }}-config
            {{- if .Values.chatService.envFromSecret }}
            - secretRef:
                name: {{ .Values.chatService.envFromSecret }}
            {{- end }}
          resources:
            {{- toYaml .Values.chatService.resources | nindent 12 }}
          {{- if .Values.chatService.startupProbe }}
          startupProbe:
            httpGet:
              path: {{ .Values.chatService.startupProbe.path }}
              port: {{ .Values.chatService.startupProbe.port }}
            initialDelaySeconds: {{ .Values.chatService.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.chatService.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.chatService.startupProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.chatService.startupProbe.failureThreshold | default 10 }}
          {{- end }}
          {{- if .Values.chatService.livenessProbe }}
          livenessProbe:
            httpGet:
              path: {{ .Values.chatService.livenessProbe.path }}
              port: {{ .Values.chatService.livenessProbe.port }}
            initialDelaySeconds: {{ .Values.chatService.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.chatService.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.chatService.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.chatService.livenessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- if .Values.chatService.readinessProbe }}
          readinessProbe:
            httpGet:
              path: {{ .Values.chatService.readinessProbe.path }}
              port: {{ .Values.chatService.readinessProbe.port }}
            initialDelaySeconds: {{ .Values.chatService.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.chatService.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.chatService.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.chatService.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          volumeMounts:
            - name: transcripts
              mountPath: /src/call_transcripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: transcripts
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
