{{- if .Values.evalService.serviceAccount.create | default .Values.global.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.evalService.serviceAccountName | default .Values.global.serviceAccountName }}
  namespace: {{ include "convogent-eval.namespace" . }}
  labels:
    {{- include "convogent-eval.labels" . | nindent 4 }}
  {{- with .Values.evalService.serviceAccount.annotations | default .Values.global.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
